<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Same geometry as components/Pock/Logo.tsx, in its `bare` form — the Grass
    tile is gone, so the bars sit directly on the browser tab.

    That removal is why the fills are theme-aware. Pear and Lime were readable
    because the dark tile sat behind them; with nothing behind, they all but
    vanish on a light tab strip. So light UI gets Grass and dark UI keeps the
    Pear/Lime break, which is the same split components/Pock/Logo.tsx makes via
    its logo-step and logo-found custom properties. Browsers honour media
    queries inside an SVG favicon.

    The opacity ramp is lifted from 0.5/0.75 as well: at 16px the faintest bar
    was already marginal on a tile, and without one it disappears.
  -->
  <style>
    .step { fill: #144419 }
    .found { fill: #144419 }
    @media (prefers-color-scheme: dark) {
      .step { fill: #a8e664 }
      .found { fill: #cdf546 }
    }
  </style>

  <rect class="step" x="3" y="20" width="5" height="6" rx="1.5" opacity="0.6"/>
  <rect class="step" x="10" y="16" width="5" height="10" rx="1.5" opacity="0.8"/>
  <rect class="step" x="17" y="12" width="5" height="14" rx="1.5"/>
  <rect class="found" x="24" y="6" width="5" height="20" rx="1.5"/>
</svg>
